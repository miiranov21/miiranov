<title>Мой день</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: одна колонка-«дневник» до 1080px; сверху сводка дня (три кольца), ниже рабочие блоки в адаптивной сетке */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --line:#DCE1E9;
  --ink:#152033; --ink-2:#4A5568; --ink-3:#7C879A;
  --accent:#2F4BD8;
  --kcal:#E8742A; --water:#1D8FE1; --read:#7A4FD6; --habit:#12A37A;
  --warn:#D9472B;
  --kcal-soft:#FBE7DA; --water-soft:#DCEEFB; --read-soft:#ECE4FA; --habit-soft:#D9F3EA;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131C; --surface:#161D29; --surface-2:#1C2533; --line:#2A3446;
  --ink:#E8EDF5; --ink-2:#AEB8C8; --ink-3:#7D899C;
  --accent:#7F95FF;
  --kcal:#F39250; --water:#4DB0F5; --read:#A585F0; --habit:#3CC79A; --warn:#F2735A;
  --kcal-soft:#3A2618; --water-soft:#132E45; --read-soft:#2B2045; --habit-soft:#123528;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131C; --surface:#161D29; --surface-2:#1C2533; --line:#2A3446;
  --ink:#E8EDF5; --ink-2:#AEB8C8; --ink-3:#7D899C;
  --accent:#7F95FF;
  --kcal:#F39250; --water:#4DB0F5; --read:#A585F0; --habit:#3CC79A; --warn:#F2735A;
  --kcal-soft:#3A2618; --water-soft:#132E45; --read-soft:#2B2045; --habit-soft:#123528;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-size:clamp(20px,4vw,26px)}
.brand .sub{color:var(--ink-3);font-size:13px}
.datenav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.datenav button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--ink-2)}
.datenav button:hover{background:var(--surface-2)}
.datenav .d{min-width:150px;text-align:center;font-weight:600;font-size:14px}
.datenav .today{width:auto;padding:0 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:42px;padding:0 14px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{border-color:var(--ink-3)}

.note{font-size:12.5px;color:var(--ink-3);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}

/* Summary rings */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ring-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;min-width:0}
.ring{flex:none;width:64px;height:64px;position:relative}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:13px;font-weight:700}
.ring-card .lbl{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.ring-card .val{font-family:var(--f-num);font-size:18px;font-weight:700;white-space:nowrap}
.ring-card .val small{font-size:12px;color:var(--ink-3);font-weight:500}
.ring-card .hint{font-size:12px;color:var(--ink-2)}
.score{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.score .bar{flex:1 1 200px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.score .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.chip.ok{background:var(--habit-soft);color:var(--habit)}
.chip.fire{background:var(--kcal-soft);color:var(--kcal)}

/* Panels grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel-head .meta{font-size:13px;color:var(--ink-3)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.span2{grid-column:1/-1}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.water{background:var(--water-soft);border-color:transparent;color:var(--water)}
.btn.read{background:var(--read-soft);border-color:transparent;color:var(--read)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--ink-3);font-weight:600}
input[type=text],input[type=number],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* Water */
.glasses{display:flex;flex-wrap:wrap;gap:6px}
.glass{width:28px;height:36px;border:2px solid var(--water);border-top-width:1px;border-radius:3px 3px 8px 8px;position:relative;overflow:hidden;background:transparent;padding:0}
.glass i{position:absolute;left:0;right:0;bottom:0;background:var(--water);opacity:.85;transition:height .25s}
.glass.extra{border-style:dashed}

/* Meals */
.meals{display:flex;flex-direction:column;gap:12px}
.meal-group h3{font-family:var(--f-body);font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;display:flex;justify-content:space-between;margin-bottom:4px}
.item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .name{flex:1;min-width:0;overflow-wrap:anywhere}
.item .x{border:0;background:transparent;color:var(--ink-3);font-size:18px;width:28px;height:28px;border-radius:8px;flex:none}
.item .x:hover{background:var(--surface-2);color:var(--warn)}
.addmeal{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.2fr) auto;gap:8px;align-items:end}
.recent{display:flex;flex-wrap:wrap;gap:6px}
.recent button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink-2)}
.recent button:hover{border-color:var(--kcal);color:var(--kcal)}
.empty{color:var(--ink-3);font-size:13.5px;padding:6px 0}

/* Books */
.book{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.book.cur{border-color:var(--read);background:var(--read-soft)}
.book .t{font-weight:700;overflow-wrap:anywhere}
.book .a{font-size:12.5px;color:var(--ink-3)}
.pbar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.book.cur .pbar{background:var(--surface)}
.pbar i{display:block;height:100%;background:var(--read)}
.book .r{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.books{display:flex;flex-direction:column;gap:8px}
details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)}
.addbook{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) minmax(0,.8fr) auto;gap:8px;align-items:end;margin-top:10px}

/* Habits */
.habits{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.habit{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;text-align:left;min-width:0}
.habit .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink-3);flex:none;display:grid;place-items:center;font-size:14px;color:transparent}
.habit.on{background:var(--habit-soft);border-color:transparent}
.habit.on .box{background:var(--habit);border-color:var(--habit);color:#fff}
.habit .hn{flex:1;min-width:0;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.habit .st{display:block;font-family:var(--f-num);font-size:11.5px;color:var(--ink-3);font-weight:500}

/* Week charts */
.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chart h3{font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px;display:flex;justify-content:space-between}
.chart svg{width:100%;height:auto;display:block}
.heat{overflow-x:auto}
.heat table{border-collapse:separate;border-spacing:4px;font-size:12px;min-width:420px;width:100%}
.heat th{font-weight:600;color:var(--ink-3);text-align:center}
.heat td:first-child{color:var(--ink-2);font-weight:600;white-space:nowrap;padding-right:6px}
.heat td.c{height:22px;border-radius:6px;background:var(--surface-2)}
.heat td.c.on{background:var(--habit)}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hlist{display:flex;flex-direction:column;gap:6px}
.hlist .row{flex-wrap:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:860px){
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{grid-template-columns:minmax(0,1fr)}
  .charts{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .addmeal{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .addmeal .field:first-child{grid-column:1/-1}
  .addbook{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .addbook .field:first-child{grid-column:1/-1}
  .ring-card{flex-direction:column;align-items:flex-start;gap:8px}
  .datenav .d{min-width:110px;font-size:13px}
  .goals{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Мой день</h1>
      <span class="sub" id="sub">Калории, вода, чтение и привычки</span>
    </div>
    <div class="row">
      <div class="datenav" role="group" aria-label="Выбор дня">
        <button id="prev" aria-label="Предыдущий день">‹</button>
        <span class="d" id="dlabel"></span>
        <button id="next" aria-label="Следующий день">›</button>
        <button class="today" id="today">Сегодня</button>
      </div>
      <button class="iconbtn" id="openSettings">⚙ Цели</button>
    </div>
  </header>

  <div class="note" id="syncNote" hidden></div>

  <section class="summary" id="summary" aria-label="Сводка дня"></section>

  <div class="grid">
    <section class="panel" aria-labelledby="h-kcal">
      <div class="panel-head">
        <h2 id="h-kcal"><span class="dot" style="background:var(--kcal)"></span>Питание</h2>
        <span class="meta num" id="kcalMeta"></span>
      </div>
      <div class="meals" id="meals"></div>
      <form class="addmeal" id="mealForm" autocomplete="off">
        <div class="field"><label for="mName">Что съел</label><input type="text" id="mName" placeholder="Овсянка с бананом" required maxlength="60"></div>
        <div class="field"><label for="mKcal">Ккал</label><input type="number" id="mKcal" placeholder="350" min="1" max="5000" required inputmode="numeric"></div>
        <div class="field"><label for="mType">Приём</label>
          <select id="mType"><option>Завтрак</option><option>Обед</option><option>Ужин</option><option>Перекус</option></select></div>
        <button class="btn primary" type="submit">Добавить</button>
      </form>
      <div class="field" id="recentWrap" hidden><label>Быстро добавить ещё раз</label><div class="recent" id="recent"></div></div>
    </section>

    <section class="panel" aria-labelledby="h-water">
      <div class="panel-head">
        <h2 id="h-water"><span class="dot" style="background:var(--water)"></span>Вода</h2>
        <span class="meta num" id="waterMeta"></span>
      </div>
      <div class="glasses" id="glasses" aria-label="Стаканы воды"></div>
      <div class="row">
        <button class="btn water" data-water="250">+ стакан 250 мл</button>
        <button class="btn water" data-water="500">+ бутылка 500 мл</button>
        <button class="btn ghost" data-water="-250">− 250 мл</button>
      </div>

      <div class="panel-head" style="margin-top:6px">
        <h2 id="h-read"><span class="dot" style="background:var(--read)"></span>Чтение</h2>
        <span class="meta num" id="readMeta"></span>
      </div>
      <div class="row" id="readBtns">
        <button class="btn read" data-pages="5">+5 стр.</button>
        <button class="btn read" data-pages="10">+10 стр.</button>
        <button class="btn read" data-pages="20">+20 стр.</button>
        <input type="number" id="pagesCustom" placeholder="стр." min="1" max="999" style="width:84px" inputmode="numeric" aria-label="Своё число страниц">
        <button class="btn read" id="pagesAdd">+</button>
        <button class="btn ghost" data-pages="-5">− 5</button>
      </div>
      <div class="books" id="books"></div>
      <details id="bookDetails">
        <summary>+ Добавить книгу</summary>
        <form class="addbook" id="bookForm" autocomplete="off">
          <div class="field"><label for="bTitle">Название</label><input type="text" id="bTitle" required maxlength="80" placeholder="Атомные привычки"></div>
          <div class="field"><label for="bAuthor">Автор</label><input type="text" id="bAuthor" maxlength="60" placeholder="Джеймс Клир"></div>
          <div class="field"><label for="bPages">Страниц</label><input type="number" id="bPages" required min="1" max="5000" placeholder="320" inputmode="numeric"></div>
          <button class="btn primary" type="submit">Добавить</button>
        </form>
      </details>
    </section>

    <section class="panel span2" aria-labelledby="h-hab">
      <div class="panel-head">
        <h2 id="h-hab"><span class="dot" style="background:var(--habit)"></span>Привычки</h2>
        <span class="meta" id="habMeta"></span>
      </div>
      <div class="habits" id="habits"></div>
    </section>

    <section class="panel span2" aria-labelledby="h-week">
      <div class="panel-head">
        <h2 id="h-week"><span class="dot" style="background:var(--accent)"></span>Последние 7 дней</h2>
        <span class="meta">пунктир — твоя цель</span>
      </div>
      <div class="charts" id="charts"></div>
      <div class="heat" id="heat"></div>
    </section>

    <section class="panel span2" aria-labelledby="h-note">
      <div class="panel-head">
        <h2 id="h-note"><span class="dot" style="background:var(--ink-3)"></span>Заметка дня</h2>
        <span class="meta" id="noteState"></span>
      </div>
      <textarea id="dayNote" maxlength="2000" placeholder="Что получилось сегодня? Что прочитал интересного? Что улучшить завтра?"></textarea>
    </section>
  </div>
</div>

<dialog id="settings" aria-labelledby="sTitle">
  <form class="dlg" id="settingsForm" method="dialog">
    <h2 id="sTitle" style="font-size:18px">Цели и привычки</h2>
    <div class="goals">
      <div class="field"><label for="gKcal">Калории в день, ккал</label><input type="number" id="gKcal" min="800" max="6000" required inputmode="numeric"></div>
      <div class="field"><label for="gWater">Вода в день, мл</label><input type="number" id="gWater" min="500" max="6000" step="50" required inputmode="numeric"></div>
      <div class="field"><label for="gPages">Чтение в день, страниц</label><input type="number" id="gPages" min="1" max="500" required inputmode="numeric"></div>
      <div class="field"><label for="gGlass">Размер стакана, мл</label><input type="number" id="gGlass" min="100" max="1000" step="10" required inputmode="numeric"></div>
    </div>
    <div class="field">
      <label>Привычки</label>
      <div class="hlist" id="hlist"></div>
      <div class="row" style="flex-wrap:nowrap"><input type="text" id="newHabit" maxlength="40" placeholder="Например: 10 000 шагов"><button class="btn" type="button" id="addHabit">Добавить</button></div>
    </div>
    <p class="note" style="margin:0">Калории засчитываются, если ты в пределах 90–105% от цели: это коридор для поддержания веса.</p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" type="button" id="cancelSettings">Отмена</button>
      <button class="btn primary" type="submit" id="saveSettings">Сохранить</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const DEFAULT_SETTINGS = {
    goals: { kcal: 2200, water: 2500, pages: 20, glass: 250 },
    habits: [
      { id: "h1", name: "Зарядка / спорт" },
      { id: "h2", name: "Медитация 10 мин" },
      { id: "h3", name: "Сон до 23:30" },
      { id: "h4", name: "Без сладкого" },
      { id: "h5", name: "10 000 шагов" }
    ]
  };
  const MEALS = ["Завтрак", "Обед", "Ужин", "Перекус"];
  const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  const WD = ["вс","пн","вт","ср","чт","пт","сб"];
  const WDF = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];

  // ---------- state ----------
  const S = { settings: clone(DEFAULT_SETTINGS), books: { list: [], current: null }, days: {} };
  let cur = todayKey();
  const dirty = new Set();       // doc ids with unsaved local edits
  const timers = {};             // debounce timers per doc
  const chains = {};             // one write at a time per doc
  let store = null;              // {save(id,obj)}
  let resolveStore; const storeReady = new Promise(r => { resolveStore = r; });

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function uid(){ return Math.random().toString(36).slice(2, 9); }
  function pad(n){ return String(n).padStart(2, "0"); }
  function keyOf(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayKey(){ return keyOf(new Date()); }
  function parseKey(k){ const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); }
  function shift(k, n){ const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
  function docId(k){ return "d-" + k; }
  function day(k){
    return S.days[k] || { date: k, meals: [], water: 0, pages: 0, habits: {}, note: "" };
  }
  function goals(){ return Object.assign({}, DEFAULT_SETTINGS.goals, S.settings.goals || {}); }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
  function fmt(n){ return Math.round(n).toLocaleString("ru-RU"); }
  function plural(n, a, b, c){ n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; }

  // ---------- persistence ----------
  function persist(id, obj, delay = 500){
    dirty.add(id);
    clearTimeout(timers[id]);
    timers[id] = setTimeout(() => {
      const body = clone(obj);
      chains[id] = (chains[id] || Promise.resolve()).then(() => storeReady).then(() => store.save(id, body)).then(() => {
        dirty.delete(id);
      }).catch(e => {
        dirty.delete(id);
        if (e && e.code === "quota_exceeded") toast("Хранилище заполнено, запись не сохранилась");
        else toast("Не удалось сохранить. Проверь соединение");
      });
    }, delay);
  }
  function commitDay(k, d, delay){ S.days[k] = d; persist(docId(k), d, delay); render(); }

  const LS_KEY = "moy-den-v1";
  const localStore = {
    load(){
      try { const raw = localStorage.getItem(LS_KEY); if (raw) { const o = JSON.parse(raw); applyDocs(Object.entries(o)); } } catch (e) {}
    },
    save(id, body){
      try {
        const raw = localStorage.getItem(LS_KEY); const o = raw ? JSON.parse(raw) : {};
        o[id] = body; localStorage.setItem(LS_KEY, JSON.stringify(o));
      } catch (e) {}
      return Promise.resolve();
    }
  };

  function applyDocs(entries){
    for (const [id, data] of entries){
      if (dirty.has(id) || !data) continue;
      if (id === "settings") S.settings = Object.assign(clone(DEFAULT_SETTINGS), clone(data));
      else if (id === "books") S.books = Object.assign({ list: [], current: null }, clone(data));
      else if (id.startsWith("d-")) S.days[id.slice(2)] = Object.assign({ meals: [], water: 0, pages: 0, habits: {}, note: "" }, clone(data));
    }
  }

  async function connect(){
    const note = $("syncNote");
    let db = null, user = null, id = null;
    try {
      if (window.claude && typeof window.claude.use === "function"){
        [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (user) id = await user.id();
      }
    } catch (e) { db = null; }

    if (!db || !id){
      store = localStore; localStore.load(); resolveStore(); render();
      note.textContent = "Данные сохраняются только в этом браузере. Войди в claude.ai, чтобы они хранились в аккаунте и были видны на всех устройствах.";
      note.hidden = false;
      return;
    }
    const col = db.collection("data/users/" + id);
    store = {
      save(docName, body){ return col.doc(docName).set(body); }
    };
    resolveStore();
    $("sub").textContent = "Синхронизация…";
    const loadTimer = setTimeout(() => {
      note.textContent = "Пока не удаётся загрузить сохранённые данные. Записи сохранятся, как только появится связь.";
      note.hidden = false;
    }, 10000);
    col.onSnapshot(snap => {
      applyDocs(snap.docs.filter(d => d.exists).map(d => [d.id, d.data()]));
      if (!snap.metadata.fromCache){ clearTimeout(loadTimer); note.hidden = true; }
      $("sub").textContent = "Сохраняется в твоём аккаунте · видно только тебе";
      render();
    }, err => {
      clearTimeout(loadTimer);
      note.textContent = "Связь с хранилищем прервалась. Обнови страницу, чтобы продолжить сохранять данные.";
      note.hidden = false;
    });
  }

  // ---------- computations ----------
  function totals(k){
    const d = day(k), g = goals();
    const kcal = d.meals.reduce((s, m) => s + (+m.kcal || 0), 0);
    const habitsDone = S.settings.habits.filter(h => d.habits[h.id]).length;
    const habitsTotal = S.settings.habits.length;
    const kcalOk = kcal >= g.kcal * 0.9 && kcal <= g.kcal * 1.05;
    const waterOk = d.water >= g.water;
    const readOk = d.pages >= g.pages;
    const parts = [kcalOk, waterOk, readOk];
    let score = parts.filter(Boolean).length + (habitsTotal ? habitsDone / habitsTotal : 0);
    const max = 3 + (habitsTotal ? 1 : 0);
    return { kcal, kcalOk, waterOk, readOk, habitsDone, habitsTotal, score: score / max, hasData: d.meals.length || d.water || d.pages || habitsDone };
  }
  function streak(){
    // consecutive days with ≥75% ending today (today counts if already ≥75%)
    let k = todayKey(), n = 0;
    if (totals(k).score < 0.75) k = shift(k, -1);
    while (totals(k).score >= 0.75 && n < 3650){ n++; k = shift(k, -1); }
    return n;
  }
  function habitStreak(hid){
    let k = todayKey(), n = 0;
    if (!day(k).habits[hid]) k = shift(k, -1);
    while (day(k).habits[hid] && n < 3650){ n++; k = shift(k, -1); }
    return n;
  }

  // ---------- render ----------
  function ring(pct, color){
    const r = 27, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct));
    return `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c * p} ${c}"/></svg>`;
  }

  function render(){
    const d = day(cur), g = goals(), t = totals(cur);
    const dt = parseKey(cur), isToday = cur === todayKey();
    $("dlabel").textContent = (isToday ? "Сегодня, " : WDF[dt.getDay()] + ", ") + dt.getDate() + " " + MONTHS[dt.getMonth()];
    $("next").disabled = isToday;
    $("next").style.opacity = isToday ? .3 : 1;
    $("today").hidden = isToday;

    // summary
    const left = g.kcal - t.kcal;
    const kcalColor = t.kcal > g.kcal * 1.05 ? "var(--warn)" : "var(--kcal)";
    const st = streak();
    $("summary").innerHTML = `
      <div class="ring-card"><div class="ring">${ring(t.kcal / g.kcal, kcalColor)}<span class="pct">${Math.round(t.kcal / g.kcal * 100)}%</span></div>
        <div><div class="lbl">Калории</div><div class="val">${fmt(t.kcal)} <small>/ ${fmt(g.kcal)}</small></div>
        <div class="hint">${left >= 0 ? "осталось " + fmt(left) + " ккал" : "перебор " + fmt(-left) + " ккал"}</div></div></div>
      <div class="ring-card"><div class="ring">${ring(d.water / g.water, "var(--water)")}<span class="pct">${Math.round(d.water / g.water * 100)}%</span></div>
        <div><div class="lbl">Вода</div><div class="val">${(d.water / 1000).toFixed(2).replace(".", ",")} <small>/ ${(g.water / 1000).toFixed(1).replace(".", ",")} л</small></div>
        <div class="hint">${t.waterOk ? "цель выполнена" : "ещё " + Math.ceil((g.water - d.water) / g.glass) + " " + plural(Math.ceil((g.water - d.water) / g.glass), "стакан", "стакана", "стаканов")}</div></div></div>
      <div class="ring-card"><div class="ring">${ring(d.pages / g.pages, "var(--read)")}<span class="pct">${Math.round(d.pages / g.pages * 100)}%</span></div>
        <div><div class="lbl">Чтение</div><div class="val">${d.pages} <small>/ ${g.pages} стр.</small></div>
        <div class="hint">${t.readOk ? "цель выполнена" : "ещё " + (g.pages - d.pages) + " стр."}</div></div></div>
      <div class="ring-card"><div class="ring">${ring(t.habitsTotal ? t.habitsDone / t.habitsTotal : 0, "var(--habit)")}<span class="pct">${t.habitsDone}/${t.habitsTotal}</span></div>
        <div><div class="lbl">Привычки</div><div class="val">${t.habitsDone} <small>из ${t.habitsTotal}</small></div>
        <div class="hint">${t.habitsTotal && t.habitsDone === t.habitsTotal ? "все отмечены" : "отметь, что сделал"}</div></div></div>
      <div class="score">
        <strong>День выполнен на <span class="num">${Math.round(t.score * 100)}%</span></strong>
        <div class="bar" aria-hidden="true"><i style="width:${Math.round(t.score * 100)}%"></i></div>
        <span class="chip ${st ? "fire" : ""}">🔥 Серия: <span class="num">${st}</span> ${plural(st, "день", "дня", "дней")}</span>
        ${t.score >= 0.75 ? '<span class="chip ok">✓ День засчитан</span>' : '<span class="chip">Засчитывается от 75%</span>'}
      </div>`;

    // meals
    $("kcalMeta").textContent = fmt(t.kcal) + " / " + fmt(g.kcal) + " ккал";
    if (!d.meals.length){
      $("meals").innerHTML = `<div class="empty">Пока ничего не записано. Добавь первый приём пищи ниже: название и калории.</div>`;
    } else {
      $("meals").innerHTML = MEALS.map(type => {
        const items = d.meals.filter(m => m.type === type);
        if (!items.length) return "";
        const sum = items.reduce((s, m) => s + (+m.kcal || 0), 0);
        return `<div class="meal-group"><h3><span>${type}</span><span class="num">${fmt(sum)} ккал</span></h3>` +
          items.map(m => `<div class="item"><span class="name">${esc(m.name)}</span><span class="num">${fmt(m.kcal)}</span><button class="x" data-delmeal="${m.id}" aria-label="Удалить ${esc(m.name)}">×</button></div>`).join("") + `</div>`;
      }).join("");
    }
    // recent foods
    const seen = new Map();
    Object.keys(S.days).sort().reverse().forEach(k => (S.days[k].meals || []).slice().reverse().forEach(m => {
      const key = m.name.trim().toLowerCase();
      if (!seen.has(key) && seen.size < 8) seen.set(key, m);
    }));
    $("recentWrap").hidden = !seen.size;
    $("recent").innerHTML = [...seen.values()].map((m, i) => `<button type="button" data-recent="${i}">${esc(m.name)} · <span class="num">${fmt(m.kcal)}</span></button>`).join("");
    $("recent")._items = [...seen.values()];

    // water
    $("waterMeta").textContent = fmt(d.water) + " / " + fmt(g.water) + " мл";
    const glassesGoal = Math.ceil(g.water / g.glass);
    const filled = d.water / g.glass;
    const count = Math.max(glassesGoal, Math.ceil(filled));
    let gh = "";
    for (let i = 0; i < count; i++){
      const f = Math.max(0, Math.min(1, filled - i));
      gh += `<button class="glass ${i >= glassesGoal ? "extra" : ""}" data-glass="${i}" aria-label="Стакан ${i + 1}"><i style="height:${f * 100}%"></i></button>`;
    }
    $("glasses").innerHTML = gh;
    document.querySelector('[data-water="250"]').textContent = "+ стакан " + g.glass + " мл";
    document.querySelector('[data-water="250"]').dataset.amount = g.glass;
    document.querySelector('[data-water="-250"]').textContent = "− " + g.glass + " мл";
    document.querySelector('[data-water="-250"]').dataset.amount = -g.glass;

    // reading
    $("readMeta").textContent = d.pages + " / " + g.pages + " стр. сегодня";
    const bl = S.books.list;
    if (!bl.length){
      $("books").innerHTML = `<div class="empty">Добавь книгу, которую читаешь сейчас. Тогда страницы будут засчитываться в её прогресс.</div>`;
      $("bookDetails").open = true;
    } else {
      const sorted = bl.slice().sort((a, b) => (a.done - b.done) || ((b.id === S.books.current) - (a.id === S.books.current)));
      $("books").innerHTML = sorted.map(b => {
        const p = Math.min(1, b.read / b.total), isCur = b.id === S.books.current;
        return `<div class="book ${isCur ? "cur" : ""}">
          <div><div class="t">${b.done ? "✓ " : ""}${esc(b.title)}</div>${b.author ? `<div class="a">${esc(b.author)}</div>` : ""}</div>
          <div class="pbar"><i style="width:${p * 100}%"></i></div>
          <div class="r"><span class="num">${b.read} / ${b.total} стр. · ${Math.round(p * 100)}%</span>
            <span class="row">${isCur ? '<span class="chip" style="background:var(--surface);color:var(--read)">читаю сейчас</span>' : (b.done ? "" : `<button class="btn sm" data-curbook="${b.id}">Читать эту</button>`)}
            <button class="btn sm ghost" data-delbook="${b.id}" aria-label="Удалить книгу">Удалить</button></span></div>
        </div>`;
      }).join("");
    }
    const doneBooks = bl.filter(b => b.done).length;
    if (doneBooks) $("readMeta").textContent += " · прочитано книг: " + doneBooks;

    // habits
    const hs = S.settings.habits;
    $("habMeta").textContent = hs.length ? t.habitsDone + " из " + hs.length + " сделано" : "";
    $("habits").innerHTML = hs.length ? hs.map(h => {
      const on = !!d.habits[h.id], s = habitStreak(h.id);
      return `<button class="habit ${on ? "on" : ""}" data-habit="${h.id}" aria-pressed="${on}"><span class="box">✓</span><span class="hn">${esc(h.name)}${s ? `<span class="st">серия ${s} ${plural(s, "день", "дня", "дней")}</span>` : ""}</span></button>`;
    }).join("") : `<div class="empty">Привычек пока нет. Добавь их в «Цели».</div>`;

    // note (don't clobber while typing)
    const ta = $("dayNote");
    if (document.activeElement !== ta || ta.dataset.day !== cur){ ta.value = d.note || ""; ta.dataset.day = cur; }

    renderWeek();
  }

  function barChart(title, color, vals, goal, unit, labels){
    const W = 300, H = 140, padL = 4, padB = 20, padT = 14;
    const max = Math.max(goal * 1.25, ...vals, 1);
    const bw = (W - padL * 2) / vals.length;
    const y = v => padT + (H - padT - padB) * (1 - v / max);
    let bars = "";
    vals.forEach((v, i) => {
      const x = padL + i * bw + bw * 0.18, w = bw * 0.64, top = y(v);
      const last = i === vals.length - 1;
      bars += `<rect x="${x}" y="${top}" width="${w}" height="${Math.max(0, H - padB - top)}" rx="4" fill="${color}" opacity="${last ? 1 : .55}"/>`;
      if (v) bars += `<text x="${x + w / 2}" y="${top - 3}" text-anchor="middle" font-size="9.5" fill="var(--ink-2)" font-family="JetBrains Mono, monospace">${unit === "л" ? (v / 1000).toFixed(1).replace(".", ",") : fmt(v)}</text>`;
      bars += `<text x="${x + w / 2}" y="${H - 5}" text-anchor="middle" font-size="10" fill="${last ? "var(--ink)" : "var(--ink-3)"}" font-weight="${last ? 700 : 400}">${labels[i]}</text>`;
    });
    const gy = y(goal);
    const avg = vals.reduce((s, v) => s + v, 0) / vals.length;
    return `<div class="chart"><h3><span>${title}</span><span class="num" style="font-weight:500;color:var(--ink-3)">в среднем ${unit === "л" ? (avg / 1000).toFixed(1).replace(".", ",") : fmt(avg)} ${unit}</span></h3>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title} за 7 дней">
        <line x1="0" x2="${W}" y1="${H - padB}" y2="${H - padB}" stroke="var(--line)"/>
        ${bars}
        <line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--ink-3)" stroke-dasharray="4 4"/>
      </svg></div>`;
  }

  function renderWeek(){
    const keys = []; for (let i = 6; i >= 0; i--) keys.push(shift(cur, -i));
    const labels = keys.map(k => { const d = parseKey(k); return WD[d.getDay()] + " " + d.getDate(); });
    const g = goals();
    $("charts").innerHTML =
      barChart("Калории", "var(--kcal)", keys.map(k => totals(k).kcal), g.kcal, "ккал", labels) +
      barChart("Вода", "var(--water)", keys.map(k => day(k).water), g.water, "л", labels) +
      barChart("Чтение", "var(--read)", keys.map(k => day(k).pages), g.pages, "стр.", labels);
    const hs = S.settings.habits;
    $("heat").innerHTML = hs.length ? `<table><thead><tr><th></th>${labels.map(l => `<th>${l}</th>`).join("")}</tr></thead><tbody>` +
      hs.map(h => `<tr><td>${esc(h.name)}</td>${keys.map(k => `<td class="c ${day(k).habits[h.id] ? "on" : ""}" title="${day(k).habits[h.id] ? "сделано" : "нет"}"></td>`).join("")}</tr>`).join("") +
      `</tbody></table>` : "";
  }

  // ---------- actions ----------
  function addWater(ml){
    const d = clone(day(cur)); d.water = Math.max(0, d.water + ml); commitDay(cur, d);
  }
  function addPages(n){
    if (!n) return;
    const d = clone(day(cur)); const before = d.pages; d.pages = Math.max(0, d.pages + n);
    const delta = d.pages - before;
    commitDay(cur, d);
    const b = S.books.list.find(x => x.id === S.books.current);
    if (b && delta){
      const books = clone(S.books); const bb = books.list.find(x => x.id === b.id);
      bb.read = Math.max(0, Math.min(bb.total, bb.read + delta));
      if (bb.read >= bb.total && !bb.done){
        bb.done = true; toast("Книга «" + bb.title + "» прочитана! 🎉");
        const next = books.list.find(x => !x.done); books.current = next ? next.id : null;
      } else if (bb.read < bb.total) bb.done = false;
      S.books = books; persist("books", books); render();
    }
  }

  $("prev").onclick = () => { cur = shift(cur, -1); render(); };
  $("next").onclick = () => { if (cur < todayKey()){ cur = shift(cur, 1); render(); } };
  $("today").onclick = () => { cur = todayKey(); render(); };

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-water],[data-pages],[data-delmeal],[data-recent],[data-habit],[data-curbook],[data-delbook],[data-glass]");
    if (!el) return;
    const ds = el.dataset;
    if (ds.water !== undefined) addWater(+(ds.amount || ds.water));
    else if (ds.pages !== undefined) addPages(+ds.pages);
    else if (ds.glass !== undefined){
      const g = goals(), i = +ds.glass, target = (i + 1) * g.glass;
      const d = clone(day(cur)); d.water = d.water >= target ? i * g.glass : target; commitDay(cur, d);
    }
    else if (ds.delmeal){ const d = clone(day(cur)); d.meals = d.meals.filter(m => m.id !== ds.delmeal); commitDay(cur, d, 0); }
    else if (ds.recent !== undefined){
      const m = $("recent")._items[+ds.recent]; if (!m) return;
      const d = clone(day(cur)); d.meals.push({ id: uid(), name: m.name, kcal: m.kcal, type: $("mType").value }); commitDay(cur, d, 0);
      toast("Добавлено: " + m.name);
    }
    else if (ds.habit){ const d = clone(day(cur)); d.habits[ds.habit] = !d.habits[ds.habit]; if (!d.habits[ds.habit]) delete d.habits[ds.habit]; commitDay(cur, d, 300); }
    else if (ds.curbook){ const b = clone(S.books); b.current = ds.curbook; S.books = b; persist("books", b, 0); render(); }
    else if (ds.delbook){
      if (el.dataset.confirm !== "1"){ el.dataset.confirm = "1"; el.textContent = "Точно удалить?"; el.style.color = "var(--warn)"; setTimeout(() => { if (el.isConnected){ el.dataset.confirm = ""; el.textContent = "Удалить"; el.style.color = ""; } }, 3000); return; }
      const b = clone(S.books); b.list = b.list.filter(x => x.id !== ds.delbook);
      if (b.current === ds.delbook){ const n = b.list.find(x => !x.done); b.current = n ? n.id : null; }
      S.books = b; persist("books", b, 0); render();
    }
  });

  $("pagesAdd").onclick = () => { const n = parseInt($("pagesCustom").value, 10); if (n > 0){ addPages(n); $("pagesCustom").value = ""; } };
  $("pagesCustom").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); $("pagesAdd").click(); } });

  // default meal type by time of day
  (() => { const h = new Date().getHours(); $("mType").value = h < 11 ? "Завтрак" : h < 16 ? "Обед" : h < 21 ? "Ужин" : "Перекус"; })();

  $("mealForm").addEventListener("submit", e => {
    e.preventDefault();
    const name = $("mName").value.trim(), kcal = parseInt($("mKcal").value, 10);
    if (!name || !(kcal > 0)) return;
    const d = clone(day(cur)); d.meals.push({ id: uid(), name, kcal, type: $("mType").value }); commitDay(cur, d, 0);
    $("mName").value = ""; $("mKcal").value = ""; $("mName").focus();
  });

  $("bookForm").addEventListener("submit", e => {
    e.preventDefault();
    const title = $("bTitle").value.trim(), total = parseInt($("bPages").value, 10);
    if (!title || !(total > 0)) return;
    const b = clone(S.books); const id = uid();
    b.list.push({ id, title, author: $("bAuthor").value.trim(), total, read: 0, done: false });
    if (!b.current) b.current = id;
    S.books = b; persist("books", b, 0);
    $("bTitle").value = $("bAuthor").value = $("bPages").value = "";
    $("bookDetails").open = false; render();
  });

  $("dayNote").addEventListener("input", e => {
    const d = clone(day(cur)); d.note = e.target.value; S.days[cur] = d;
    $("noteState").textContent = "сохраняю…";
    persist(docId(cur), d, 900);
    clearTimeout(timers.noteLbl); timers.noteLbl = setTimeout(() => { $("noteState").textContent = "сохранено"; }, 1400);
  });

  // ---------- settings ----------
  let draftHabits = [];
  function renderHList(){
    $("hlist").innerHTML = draftHabits.map((h, i) => `<div class="row"><input type="text" value="${esc(h.name)}" data-hi="${i}" maxlength="40" aria-label="Привычка ${i + 1}"><button class="btn ghost sm" type="button" data-hdel="${i}" aria-label="Удалить привычку">×</button></div>`).join("") || `<div class="empty">Нет привычек</div>`;
  }
  $("openSettings").onclick = () => {
    const g = goals();
    $("gKcal").value = g.kcal; $("gWater").value = g.water; $("gPages").value = g.pages; $("gGlass").value = g.glass;
    draftHabits = clone(S.settings.habits); renderHList();
    $("settings").showModal();
  };
  $("hlist").addEventListener("input", e => { const i = e.target.dataset.hi; if (i !== undefined) draftHabits[+i].name = e.target.value; });
  $("hlist").addEventListener("click", e => { const i = e.target.dataset.hdel; if (i !== undefined){ draftHabits.splice(+i, 1); renderHList(); } });
  $("addHabit").onclick = () => { const v = $("newHabit").value.trim(); if (v){ draftHabits.push({ id: "h" + uid(), name: v }); $("newHabit").value = ""; renderHList(); } };
  $("newHabit").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); $("addHabit").click(); } });
  $("cancelSettings").onclick = () => $("settings").close();
  $("settingsForm").addEventListener("submit", e => {
    e.preventDefault();
    const num = (id, lo, hi, def) => { const n = parseInt($(id).value, 10); return n >= lo && n <= hi ? n : def; };
    const g = goals();
    S.settings = {
      goals: { kcal: num("gKcal", 800, 6000, g.kcal), water: num("gWater", 500, 6000, g.water), pages: num("gPages", 1, 500, g.pages), glass: num("gGlass", 100, 1000, g.glass) },
      habits: draftHabits.map(h => ({ id: h.id, name: h.name.trim() })).filter(h => h.name)
    };
    persist("settings", S.settings, 0);
    $("settings").close(); render(); toast("Цели сохранены");
  });

  // ---------- misc ----------
  let toastT;
  function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); }

  // roll over to the new day if the page stays open past midnight
  let lastToday = todayKey();
  setInterval(() => { const t = todayKey(); if (t !== lastToday){ if (cur === lastToday) cur = t; lastToday = t; render(); } }, 60000);

  render();
  connect();
})();
</script>
